name: Generate real homework model JSON
on:
  push:
    paths:
      - '.github/workflows/generate-homework-results.yml'
      - 'homework/run_model_results.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch>=2.2,<3' 'transformers==4.49.0' 'sentencepiece==0.2.1' 'safetensors>=0.4.3'
      - name: Run actual FLAN-T5 inference
        run: python homework/run_model_results.py
      - name: Commit generated JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add homework/results/live_demo_result.json homework/results/evaluation_result.json
          if ! git diff --cached --quiet; then
            git commit -m "Save measured model homework JSON results"
            git push
          fi
